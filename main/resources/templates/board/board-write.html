<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html-head(~{::assets})}">
    <th:block th:fragment="assets">
	<script th:src="@{/js/board-write.js}" defer></script>
	<link rel="stylesheet" th:href="@{/css/board.css}">
    </th:block>
</head>
<body>
	<div th:replace="~{fragments/header :: body-design(~{::#main-contents})}">
		<div id="main-contents">
		<th:block th:replace="~{fragments/header :: top-menu}"></th:block>
			<div class="post-container">
				<div class="post-container-upper">
					<select class="post-category-select" id="post-category">
						<option value="Manage" sec:authorize="hasRole('ADMIN')">관리</option>
						<option value="Notice" sec:authorize="hasRole('ADMIN')">공지</option>
						<option value="General" selected="selected">일반</option>
					</select>
				    <input type="text" class="post-title-input" id="post-title" placeholder="제목을 입력해 주세요.">
				</div>
				<textarea class="post-content-textarea" id="post-content"></textarea>
			    <div class="button-group">
					<span class="board-button">
					    <a class="board-link" th:href="@{/board}">취소</a>
					</span>
					<span class="board-button">
					    <button class="board-link" id="post-button">등록</button>
					</span>
			    </div>
			</div>
		</div>
	</div>
</body>
</html>
